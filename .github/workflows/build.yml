name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOB-BlindTimer-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to apk branch
        run: |
          mkdir -p /tmp/apkout
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apkout/MOB-BlindTimer.apk
          cd /tmp/apkout
          git init -q -b apk
          git config user.name "MOB"
          git config user.email "mob@mobps.pl"
          git add MOB-BlindTimer.apk
          git commit -q -m "APK build ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin apk
